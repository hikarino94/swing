name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Ruff
      run: |
        ruff check --fix .

    - name: Run Black
      run: |
        black --check .

    - name: Run isort
      run: |
        isort --check-only .

    - name: Run MyPy
      run: |
        mypy . --ignore-missing-imports || echo "::warning::Type checking failed - this will become an error in the future"

    - name: Run Bandit (Security)
      run: |
        bandit -r . -f json -o bandit-report.json || echo "::warning::Security scan found issues"
        if [ -f bandit-report.json ]; then
          echo "Security scan results:"
          cat bandit-report.json
        fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Create test database
      run: |
        python db/db_schema.py

    - name: Setup Python Path
      run: |
        # Pythonパスの設定を明示的に行う
        echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

    - name: Debug Import Issues
      run: |
        # インポートの問題をデバッグ
        echo "Testing module imports..."
        python -c "import sys; print('sys.path:', sys.path)"
        python -c "from src.config import Config; print('Config import: OK')" || true
        python -c "from src.ui.web import app; print('Web app import: OK')" || true
        python -c "from fetch import daily_quotes; print('Fetch module import: OK')" || true

    - name: Run tests
      id: pytest
      run: |
        export PYTHONPATH="${PYTHONPATH}:${PWD}"
        export PYTHONWARNINGS="ignore::DeprecationWarning:numpy"
        export PYTHONWARNINGS="ignore::UserWarning"
        # デバッグ情報を出力
        echo "Current directory: $(pwd)"
        echo "PYTHONPATH: $PYTHONPATH"
        echo "Python version: $(python --version)"
        # テスト実行（最初のエラーで停止）
        pytest -v --tb=short --cov=. --cov-report=xml --cov-report=term -x

    - name: Check coverage threshold
      run: |
        # 現在のカバレッジが低いため、段階的に上げる
        coverage report --fail-under=5 || echo "::warning::Coverage is below 5% - please add more tests"

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  validate-config:
    name: Validate Configuration
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check config files
      run: |
        # JSONファイルの妥当性チェック
        for file in config.json.example account.json.example screening/thresholds.json.example; do
          if [ -f "$file" ]; then
            echo "Validating $file..."
            python -m json.tool "$file" > /dev/null || exit 1
          fi
        done

    - name: Check Python imports
      run: |
        # 基本的なインポートチェック
        python -c "import sys; sys.path.append('.'); from src.config import Config" || echo "::error::Failed to import Config"
        python -c "from scripts.setup_environment import EnvironmentSetup" || echo "::warning::setup_environment import check failed"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build wheel

    - name: Build distribution
      run: |
        python -m build

    - name: Check distribution
      run: |
        pip install twine
        twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
