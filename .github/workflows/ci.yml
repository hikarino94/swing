name: CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'refactor/**' ]
  pull_request:
    branches: [ main ]

# ジョブの同時実行数を設定
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true  # 一つでも失敗したら即座に終了
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        # 浅いクローンで高速化（最新のコミットのみ取得）
        fetch-depth: 1
        # LFS ファイルをスキップ（必要ない場合）
        lfs: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.local
          ${{ env.pythonLocation }}
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        # CI環境では最小限の依存関係のみインストール
        pip install -r requirements.txt -r requirements-test.txt
        # パッケージを開発モードでインストール（モジュール解決のため）
        pip install -e .

    - name: Run linters
      run: |
        ruff check .
        black --check .
        isort --check-only .

    - name: Run MyPy
      run: |
        mypy . --ignore-missing-imports --no-strict-optional || echo "::warning::Type checking failed"

    - name: Run Bandit
      run: |
        bandit -r . -f json -o bandit-report.json || echo "::warning::Security scan found issues"

    - name: Setup test environment
      env:
        TESTING: "1"
        FLASK_ENV: "testing"
        DATABASE_PATH: "${{ github.workspace }}/test_stock.db"
        PYTHONPATH: "${{ github.workspace }}"
      run: |
        echo "Creating test database..."
        python db/db_schema.py
        if [ -f "$DATABASE_PATH" ]; then
          echo "Database created successfully"
        else
          echo "::error::Database file not created"
          exit 1
        fi

        # Create test config files
        mkdir -p config
        echo '{"idToken": "test_token_for_ci"}' > config/idtoken.json
        echo '{"mail": "test@example.com", "password": "test_password"}' > config/account.json

    - name: Run tests
      env:
        PYTHONPATH: "${{ github.workspace }}"
        PYTHONWARNINGS: "ignore::DeprecationWarning:numpy,ignore::UserWarning,ignore::FutureWarning"
        TESTING: "1"
        FLASK_ENV: "testing"
        DATABASE_PATH: "${{ github.workspace }}/test_stock.db"
      run: |
        # デバッグ情報を表示
        echo "Python path: $PYTHONPATH"
        echo "Current directory: $(pwd)"
        echo "Python version: $(python --version)"
        echo "Installed packages:"
        pip list | grep -E "(pytest|pandas|numpy|flask)"

        # ディレクトリ構造の確認
        echo "Test directory structure:"
        ls -la tests/
        echo "Check for __init__.py files:"
        find . -name "__init__.py" -path "*/tests/*" -o -path "*/src/*" -o -path "*/backtest/*" -o -path "*/db/*" -o -path "*/fetch/*" -o -path "*/screening/*" | head -20

        # テストコレクションのドライラン
        echo "Collecting tests..."
        pytest --collect-only -q || {
          echo "::error::Test collection failed"
          pytest --collect-only -vvv
          exit 1
        }

        # テストを実行
        pytest -v --tb=short || {
          EXIT_CODE=$?
          echo "::error::Test failed with exit code: $EXIT_CODE"
          if [ $EXIT_CODE -eq 4 ]; then
            echo "::error::No tests were collected. Checking test discovery..."
            pytest --collect-only -vvv
          else
            # 失敗したテストの詳細を表示
            pytest --lf -vvv --tb=long || true
          fi
          exit $EXIT_CODE
        }

    - name: Check coverage
      run: |
        coverage report --fail-under=5 || echo "::warning::Coverage is below 5%"

    - name: Upload coverage
      if: always() && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  validate-config:
    name: Validate Configuration
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # 浅いクローンで高速化（最新のコミットのみ取得）
        fetch-depth: 1
        # LFS ファイルをスキップ（必要ない場合）
        lfs: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check config files
      run: |
        for file in config.json.example account.json.example screening/thresholds.json.example; do
          if [ -f "$file" ]; then
            echo "Validating $file..."
            python -m json.tool "$file" > /dev/null || exit 1
          fi
        done

    - name: Check Python imports
      run: |
        python -c "import sys; sys.path.append('.'); from src.config import THRESHOLDS_FILE" || echo "::error::Failed to import from src.config"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: success()

    steps:
    - uses: actions/checkout@v4
      with:
        # 浅いクローンで高速化（最新のコミットのみ取得）
        fetch-depth: 1
        # LFS ファイルをスキップ（必要ない場合）
        lfs: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip build wheel

    - name: Build distribution
      run: |
        python -m build

    - name: Check distribution
      run: |
        pip install twine
        twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
