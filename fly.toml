# fly.toml app configuration file
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "swing-trading-tool"
primary_region = "nrt"  # 東京リージョン
kill_signal = "SIGINT"
kill_timeout = "5s"

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  ENVIRONMENT = "production"
  DATABASE_TYPE = "postgres"
  FLASK_ENV = "production"
  # ポートフォリオと取引管理機能のみ有効化
  PORTFOLIO_ONLY_MODE = "true"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 10  # 無料枠向けに制限
    soft_limit = 5   # 無料枠向けに制限

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"
    restart_limit = 0

  [[services.http_checks]]
    interval = "30s"
    grace_period = "5s"
    method = "get"
    path = "/health"
    protocol = "http"
    restart_limit = 0
    timeout = "2s"
    tls_skip_verify = false
    [services.http_checks.headers]

[mounts]
  # 永続ストレージ（ログ、MLモデル等）
  source = "data"
  destination = "/app/data"

# PostgreSQLデータベース設定
# fly postgres create --name swing-db --region nrt
# fly postgres attach swing-db

# 無料枠内のリソース設定
# Fly.ioの無料枠: 3 shared-cpu-1x VMs (256MB RAM each)
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256  # 無料枠の最小メモリ

# 自動スケーリングを無効化（課金を防ぐため）
[metrics]
  port = 9091
  path = "/metrics"  # メトリクス無効化

# スケーリング設定
[processes]
  app = "gunicorn src.ui.web:app"

# マシン数を1台に固定
[[services]]
  auto_stop_machines = true  # アイドル時は自動停止
  auto_start_machines = true  # リクエスト時に自動起動
  min_machines_running = 0   # 最小稼働数を0に（コスト削減）
