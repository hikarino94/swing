[pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Additional options
addopts =
    -ra
    --strict-markers
    --strict-config
    --ignore=venv
    --ignore=.venv
    --ignore=.git
    --ignore=htmlcov
    --ignore=dist
    --ignore=build
    --ignore=*.egg-info
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning
    -W ignore::FutureWarning

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Coverage options
norecursedirs = .git .tox dist build *.egg venv .venv htmlcov

# Timeout
timeout = 300

# Environment
env =
    TESTING=1
    FLASK_ENV=testing
