<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイムログ - Swing Trading</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>📊 リアルタイムログ</h1>
            <p class="subtitle">システムの動作状況をリアルタイムで監視</p>
        </div>
    </div>

    <div class="container">
        <!-- Navigation -->
        <div class="nav-section slide-in">
            <div class="nav-links">
                <a href="/" class="nav-link">
                    🏠 <span>メイン画面</span>
                </a>
                <a href="/status" class="nav-link secondary">
                    🔍 <span>システムステータス</span>
                </a>
                <a href="#" onclick="clearLogs()" class="nav-link" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">
                    🗑️ <span>ログクリア</span>
                </a>
                <a href="#" onclick="toggleAutoScroll()" class="nav-link" id="auto-scroll-btn">
                    ⏸️ <span>自動スクロール</span>
                </a>
            </div>
        </div>

        <!-- Log Display -->
        <div class="card">
            <div class="card-header">
                <span class="card-icon">📋</span>
                <h2>ログ出力</h2>
                <div class="status-indicator" id="log-status">
                    <span id="log-count">0</span> 件のログ
                </div>
            </div>

            <div class="log-container" id="log-container">
                <div class="log-entry" id="initial-message">
                    <span class="log-timestamp">システム起動</span>
                    <span class="log-level log-level-info">INFO</span>
                    <span class="log-message">ログ監視を開始しました。新しいログがここに表示されます。</span>
                </div>
            </div>
        </div>
    </div>

    <style>
        .log-container {
            max-height: 600px;
            overflow-y: auto;
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
        }

        .log-entry {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 0.5rem;
            border-bottom: 1px solid #e9ecef;
            animation: slideIn 0.3s ease-out;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-timestamp {
            color: var(--text-secondary);
            font-size: 0.8rem;
            min-width: 130px;
            white-space: nowrap;
        }

        .log-level {
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            min-width: 50px;
            text-align: center;
        }

        .log-level-info {
            background: rgba(52,152,219,0.1);
            color: var(--primary-color);
        }

        .log-level-warning {
            background: rgba(243,156,18,0.1);
            color: var(--warning-color);
        }

        .log-level-error {
            background: rgba(231,76,60,0.1);
            color: var(--accent-color);
        }

        .log-level-debug {
            background: rgba(149,165,166,0.1);
            color: var(--text-secondary);
        }

        .log-message {
            flex: 1;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .log-entry.new {
            background: linear-gradient(90deg, rgba(52,152,219,0.1), transparent);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .auto-scroll-enabled {
            background: linear-gradient(135deg, var(--success-color), #27ae60) !important;
        }

        .auto-scroll-disabled {
            background: linear-gradient(135deg, var(--text-secondary), #6c7b7d) !important;
        }

        .empty-logs {
            text-align: center;
            color: var(--text-secondary);
            font-style: italic;
            padding: 2rem;
        }
    </style>

    <script>
        let autoScroll = true;
        let logCount = 0;

        function updateLogs() {
            fetch('/api/logs')
                .then(response => response.json())
                .then(logs => {
                    if (logs.length > 0) {
                        const container = document.getElementById('log-container');
                        const initialMessage = document.getElementById('initial-message');

                        // 初期メッセージを削除
                        if (initialMessage) {
                            initialMessage.remove();
                        }

                        logs.forEach(log => {
                            const logEntry = document.createElement('div');
                            logEntry.className = 'log-entry new';

                            const levelClass = `log-level-${log.level.toLowerCase()}`;

                            logEntry.innerHTML = `
                                <span class="log-timestamp">${log.timestamp}</span>
                                <span class="log-level ${levelClass}">${log.level}</span>
                                <span class="log-message">${escapeHtml(log.message)}</span>
                            `;

                            container.appendChild(logEntry);
                            logCount++;

                            // 新しいログのハイライトを一定時間後に削除
                            setTimeout(() => {
                                logEntry.classList.remove('new');
                            }, 3000);
                        });

                        // 自動スクロール
                        if (autoScroll) {
                            container.scrollTop = container.scrollHeight;
                        }

                        // ログ数を更新
                        document.getElementById('log-count').textContent = logCount;

                        // 最大1000件でログを制限
                        const allLogs = container.querySelectorAll('.log-entry');
                        if (allLogs.length > 1000) {
                            for (let i = 0; i < allLogs.length - 1000; i++) {
                                allLogs[i].remove();
                                logCount--;
                            }
                        }
                    }
                })
                .catch(error => {
                    console.error('ログ取得エラー:', error);
                });
        }

        function clearLogs() {
            if (confirm('全てのログをクリアしますか？')) {
                const container = document.getElementById('log-container');
                container.innerHTML = '<div class="empty-logs">ログがクリアされました。新しいログがここに表示されます。</div>';
                logCount = 0;
                document.getElementById('log-count').textContent = logCount;
            }
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            const btn = document.getElementById('auto-scroll-btn');

            if (autoScroll) {
                btn.innerHTML = '⏸️ <span>自動スクロール</span>';
                btn.classList.remove('auto-scroll-disabled');
                btn.classList.add('auto-scroll-enabled');

                // スクロールを最下部に移動
                const container = document.getElementById('log-container');
                container.scrollTop = container.scrollHeight;
            } else {
                btn.innerHTML = '▶️ <span>手動スクロール</span>';
                btn.classList.remove('auto-scroll-enabled');
                btn.classList.add('auto-scroll-disabled');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            updateLogs();
            setInterval(updateLogs, 1000); // 1秒ごとに更新

            // 初期状態の設定
            const btn = document.getElementById('auto-scroll-btn');
            btn.classList.add('auto-scroll-enabled');
        });
    </script>
</body>
</html>
